[project]
name = "seogate"
version = "0.1.0"
description = "crawlgate: an SEO regression gate for CI. Diffs your preview deploy's SEO surface against a committed baseline and fails the build on regressions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miracle73" }]
requires-python = ">=3.11"
keywords = ["seo", "ci", "github-action", "playwright", "regression", "hreflang", "opengraph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27",
  "playwright>=1.45",
  "pydantic>=2.7",
  "typer>=0.12",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pillow>=10.3",
]

[project.urls]
Homepage = "https://github.com/miracle73/crawlgate"
Issues = "https://github.com/miracle73/crawlgate/issues"
Demo = "https://github.com/miracle73/crawlgate-action-demo/pull/1"

[project.scripts]
crawlgate = "crawlgate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
